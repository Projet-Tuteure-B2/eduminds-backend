# ===========================
#  SYNAPZ — Configuration
# ===========================

server.port=8082

# ===========================
#  Base de données — MariaDB
# ===========================
spring.datasource.url=jdbc:mariadb://localhost:3306/synapz_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Africa/Douala
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===========================
#  JWT
# ===========================
# Définis cette variable d'environnement avant de lancer :
#   Windows : set SYNAPZ_JWT_SECRET=un-secret-de-32-caracteres-minimum-ici
#   Linux   : export SYNAPZ_JWT_SECRET=un-secret-de-32-caracteres-minimum-ici
synapz.jwt.secret=${SYNAPZ_JWT_SECRET:synapz-default-secret-change-en-production-32chars}
synapz.jwt.expiration=86400000

# ===========================
#  API Claude (Anthropic)
# ===========================
# Définis cette variable d'environnement avant de lancer :
#   Windows : set CLAUDE_API_KEY=sk-ant-api03-...
claude.api.key=${CLAUDE_API_KEY:}
claude.api.model.default=claude-haiku-4-5-20251001
claude.api.model.diagnostic=claude-sonnet-4-6

# ===========================
#  Upload de fichiers
# ===========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
synapz.upload.dir=${UPLOAD_DIR:uploads/cours}
synapz.upload.max-files=5

# ===========================
#  Logs
# ===========================
logging.level.com.eduminds=DEBUG
logging.level.org.springframework.security=WARN
